<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DTV Admin — Sign In</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#0A0A0B; --ink-2:#1B1B1F; --gold:#F2B84B; --gold-deep:#C9821F;
      --bg:#F8FAFC; --surface:#FFFFFF; --text:#0B1220; --text-muted:#5B6B85;
      --border:#E2E8F0; --radius:16px; --shadow:0 10px 30px -12px rgba(11,18,32,0.16);
      --danger:#DC2626;
    }
    *{box-sizing:border-box; margin:0; padding:0;}
    body{
      background:linear-gradient(150deg, var(--ink) 0%, var(--ink-2) 60%, #000 130%);
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      font-family:'DM Sans', -apple-system, sans-serif;
      -webkit-font-smoothing:antialiased; padding:20px;
    }
    .login-card{
      background:var(--surface); border-radius:var(--radius); box-shadow:0 30px 80px -20px rgba(0,0,0,0.6);
      width:100%; max-width:400px; padding:36px 32px; text-align:center;
    }
    .login-card .mark{
      width:56px; height:56px; border-radius:50%; margin:0 auto 18px;
      background:linear-gradient(135deg, var(--ink-2), #000);
      display:flex; align-items:center; justify-content:center;
    }
    .login-card .mark svg{width:28px; height:28px; color:var(--gold);}
    .login-card h1{font-family:'Space Grotesk', sans-serif; font-size:22px; margin-bottom:6px; color:var(--text);}
    .login-card p{color:var(--text-muted); font-size:14px; margin-bottom:26px;}
    .form-row{margin-bottom:16px; text-align:left;}
    .form-row label{display:block; font-size:13px; font-weight:600; color:var(--text); margin-bottom:6px;}
    .input{
      width:100%; padding:12px 14px; border:1.5px solid var(--border); border-radius:10px;
      font-size:14px; font-family:'DM Sans', sans-serif; outline:none; transition:border-color .2s;
      background:var(--surface);
    }
    .input:focus{border-color:var(--gold);}
    .btn{
      width:100%; padding:13px 20px; border-radius:10px; font-size:15px; font-weight:700;
      display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
      border:none; font-family:'DM Sans', sans-serif; margin-top:6px;
      background:linear-gradient(135deg, var(--gold) 0%, var(--gold-deep) 100%);
      color:#241503; box-shadow:0 10px 24px -8px rgba(201,130,31,0.55);
      transition:transform .15s ease, box-shadow .15s ease;
    }
    .btn:hover{transform:translateY(-2px);}
    .btn:disabled{opacity:0.6; transform:none; cursor:default;}
    .error{
      display:none; background:rgba(220,38,38,0.08); border:1px solid rgba(220,38,38,0.25);
      color:var(--danger); font-size:13px; font-weight:600; border-radius:10px;
      padding:11px 14px; margin-bottom:14px;
    }
    .error.visible{display:block;}
    .foot{margin-top:22px; font-size:12.5px; color:var(--text-muted);}
    .foot a{color:var(--gold-deep); font-weight:600; text-decoration:none;}
  </style>
</head>

<body>
  <div class="login-card">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>
    </div>
    <h1 class="heading">DTV Admin</h1>
    <p>Sign in to manage codes, courses &amp; sessions.</p>
    <div class="error" id="errorBox"></div>
    <form id="loginForm" autocomplete="off">
      <div class="form-row">
        <label for="username">Username</label>
        <input type="text" class="input" id="username" autocomplete="username" required>
      </div>
      <div class="form-row">
        <label for="password">Password</label>
        <input type="password" class="input" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn" id="loginBtn">Sign In</button>
    </form>
    <div class="foot"><a href="/">← Back to site</a></div>
  </div>

  <script>
  (function(){
    'use strict';
    var form = document.getElementById('loginForm');
    var errorBox = document.getElementById('errorBox');
    var loginBtn = document.getElementById('loginBtn');

    function showError(msg){
      errorBox.textContent = msg;
      errorBox.classList.add('visible');
    }

    form.addEventListener('submit', function(e){
      e.preventDefault();
      errorBox.classList.remove('visible');
      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in…';

      fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      })
      .then(function(res){
        return res.json().catch(function(){ return { success:false, error:'Server error (' + res.status + ')' }; });
      })
      .then(function(data){
        if (data.success) {
          window.location.href = '/admin';
          return;
        }
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
        if (String(data.error || '').indexOf('Too many login attempts') !== -1) {
          showError(data.error);
        } else {
          showError('Invalid username or password.');
        }
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      })
      .catch(function(){
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
        showError('Cannot reach the server. Make sure "node server.js" is running, then try again.');
      });
    });
  })();
  </script>
</body>
</html>
